name: Job
permissions: write-all
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-daily:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - run: yarn
      - run: node index.js
      - name: Create png
        uses: actions/upload-artifact@v5
        with:
          name: png
          path: ./*.png
          retention-days: 2
      - run: echo "新行" >> README.md
      - name: commit
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m 'update'
          git push